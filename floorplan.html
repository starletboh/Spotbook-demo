<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Floor Plan — Spotbook</title>
    <link rel="stylesheet" href="assets/css/common.css">
    <link rel="stylesheet" href="assets/css/layout.css">
</head>
<body>

<nav class="sidebar"></nav>

<main class="content">

<header>
    <div class="header-main">
        <h1>Floor Plan</h1>
        <div class="header-controls">
            <input type="date" id="view-date" onchange="loadGrid()">
            <input type="text" id="search-bar" placeholder="Search (e.g. A1)…" oninput="filterGrid()">
            <button id="admin-manage-btn" class="manage-btn" onclick="toggleModal('manage-modal')">Manage</button>
            <div class="row-shortcuts">
                <span>Rows:</span>
                <button onclick="quickRow(1)">1</button>
                <button onclick="quickRow(2)">2</button>
                <button onclick="quickRow(3)">3</button>
                <button onclick="clearFilter()" style="background:#444">Clear</button>
            </div>
        </div>
    </div>
    <div class="legend">
        <div class="legend-item"><span class="dot free"></span><span>Free</span></div>
        <div class="legend-item"><span class="dot reserved"></span><span>Reserved</span></div>
        <div class="legend-item"><span class="dot maintenance"></span><span>Arrived</span></div>
    </div>
</header>

<div class="grid" id="grid"></div>

</main>

<!-- Manage Modal -->
<div id="manage-modal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="toggleModal('manage-modal')">&times;</span>
        <h3>Layout Configuration</h3>
        <form id="createElementForm" class="res-form" onsubmit="addSpot(event)">
            <label>Label (e.g. D1)</label>
            <input type="text" name="label" class="modal-input" placeholder="D1" required>
            <label>Row Number</label>
            <input type="number" name="row" class="modal-input" placeholder="4" required>
            <button type="submit" style="width:100%;margin-top:10px;background:#7b2cff;">Add to Layout</button>
        </form>
        <hr style="border:0;border-top:1px solid rgba(255,255,255,0.1);margin:20px 0;">
        <button id="delete-mode-btn" style="width:100%;background:#e74c3c" onclick="toggleDeleteMode()">Enable Delete Mode</button>
    </div>
</div>

<!-- Reservation Modal -->
<div id="reservation-modal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="toggleModal('reservation-modal')">&times;</span>
        <h3 id="res-title">Spot Details</h3>
        <div id="res-status-display" style="margin-bottom:15px;"></div>
        <div id="res-details"></div>
    </div>
</div>

<div id="popup" class="popup"></div>

<script src="assets/js/mock-data.js"></script>
<script src="assets/js/core.js"></script>
<script src="assets/js/navigation.js"></script>
<script>
let isDeleteMode = false;
let _localGrid   = [];

function toggleModal(id) {
    const modal = document.getElementById(id);
    if (modal) modal.classList.toggle('show');
}

function hexToRgba(hex, alpha) {
    const r = parseInt(hex.slice(1,3),16),
          g = parseInt(hex.slice(3,5),16),
          b = parseInt(hex.slice(5,7),16);
    return `rgba(${r},${g},${b},${alpha})`;
}

function escapeHtml(str) {
    return String(str || '').replace(/[&<>"']/g, m =>
        ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function loadGrid() {
    _localGrid = JSON.parse(JSON.stringify(DEMO.grid));
    renderGrid();
}

function renderGrid() {
    const grid = document.getElementById('grid');
    grid.style.setProperty('--desktop-cols', DEMO.gridColumns);

    grid.innerHTML = _localGrid.map(item => {
        const bookings = Array.isArray(item.bookingDetails) ? item.bookingDetails : [];
        const isFree   = bookings.length === 0;
        const isMaint  = item.isMaintenance;
        const isChecked= !isFree && bookings[0]?.checkedIn;

        let stateClass    = 'is-free';
        let displayStatus = 'FREE';
        let coreColor     = '#7b2cff';

        if (isMaint) {
            stateClass    = 'is-maintenance';
            displayStatus = '🔧 MAINTENANCE';
            coreColor     = '#e67e22';
        } else if (!isFree) {
            stateClass    = isChecked ? 'is-checked-in' : 'is-reserved';
            displayStatus = isChecked ? 'ARRIVED' : 'RESERVED';
            coreColor     = isChecked ? '#2ecc71' : '#e74c3c';
        }

        const borderStyle = isFree && !isMaint
            ? 'border: 1px solid rgba(255,255,255,0.1);'
            : `border: 1px solid ${hexToRgba(coreColor, 0.7)};`;

        const searchString = [
            item.label || '',
            ...bookings.map(b => `${b.customerName||''} ${b.customerPhone||''}`)
        ].join(' ').toLowerCase();

        return `
            <div class="sunbed ${isDeleteMode ? 'delete-ready' : ''} ${stateClass}"
                data-label="${item.label.toLowerCase()}"
                data-bookings="${escapeHtml(searchString)}"
                data-row="${item.rowNumber}"
                style="${borderStyle}"
                onclick="handleItemClick(${item.id})">
                <div class="sunbed-content">
                    <div class="legend-item">
                        <span class="dot" style="background:${hexToRgba(coreColor,0.9)};"></span>
                    </div>
                    <div class="label">${item.label}</div>
                </div>
                <div class="status-text">${displayStatus}</div>
                ${isDeleteMode ? '<div class="delete-overlay">×</div>' : ''}
            </div>`;
    }).join('');

    filterGrid();
}

function handleItemClick(id) {
    const item = _localGrid.find(i => i.id === id);
    if (!item) return;
    if (isDeleteMode) { deleteSpot(id); return; }
    openReservation(item);
}

function openReservation(item) {
    if (!item) return;
    const bookings    = Array.isArray(item.bookingDetails) ? item.bookingDetails : [];
    const hasBookings = bookings.length > 0;
    const currency    = 'EUR';

    let titleParts = [`Spot ${item.label}`];
    if (item.rowNumber) titleParts.push(`Row ${item.rowNumber}`);
    if (item.price)     titleParts.push(`${item.price} ${currency}`);
    document.getElementById('res-title').textContent = titleParts.join(' | ');

    const statusDisplay = document.getElementById('res-status-display');
    if (statusDisplay) {
        const st = item.status || 'free';
        statusDisplay.innerHTML = `<span class="status-badge ${st}">${st.charAt(0).toUpperCase()+st.slice(1)}</span>`;
    }

    let html = `<div class="bookings-list">`;
    if (hasBookings) {
        bookings.forEach(res => {
            const hasNotes = res.notes && !['none','null','n/a'].includes((res.notes||'').toLowerCase().trim());
            html += `
                <div class="res-info-card">
                    <div><strong>Guest:</strong> ${escapeHtml(res.customerName)}</div>
                    <div><strong>Phone:</strong> ${escapeHtml(res.customerPhone || 'N/A')}</div>
                    ${hasNotes ? `<div><strong>Notes:</strong><br><pre style="white-space:pre-wrap;font-family:inherit;margin:4px 0 0;">${escapeHtml(res.notes)}</pre></div>` : ''}
                    <div><strong>Time:</strong> ${res.startTime||'00:00'} – ${res.endTime||'00:00'}</div>
                    <div class="action-buttons">
                        ${!res.checkedIn ? `<button class="btn-checkin" onclick="demoCheckIn(${item.id},${res.resId||res.id},'${escapeHtml(item.label)}')">Check-In</button>` : `<span style="color:#2ecc71;font-size:13px;">✔ Arrived</span>`}
                        <button class="btn-cancel" onclick="demoCancel(${item.id},${res.resId||res.id})">Cancel</button>
                    </div>
                </div>`;
        });
    } else {
        html += `<p style="opacity:0.6;font-size:14px;">No reservations for this spot.</p>`;
    }
    html += `</div><hr style="margin:20px 0;">`;

    if (hasBookings) {
        html += `<button id="toggle-form-btn" class="glow-on-hover" style="width:100%;margin-bottom:10px;"
            onclick="document.getElementById('new-res-form').style.display='block';this.style.display='none';">
            + New Reservation</button>
            <div id="new-res-form" class="res-form" style="display:none;">`;
    } else {
        html += `<div id="new-res-form" class="res-form">`;
    }

    html += `
        <h4>New Reservation</h4>
        <label>Customer Name *</label>
        <input id="cust-name" class="modal-input" type="text" placeholder="Full name…">
        <label>Phone</label>
        <input id="cust-phone" class="modal-input" type="tel" placeholder="+30 6…">
        <label>Time</label>
        <div style="display:flex;gap:10px;">
            <input id="cust-start" class="modal-input" type="time" value="10:00">
            <input id="cust-end"   class="modal-input" type="time" value="19:00">
        </div>
        <label>Notes</label>
        <textarea id="cust-notes" class="modal-input" placeholder="Special requests…" rows="3"></textarea>
        <button class="glow-on-hover" style="width:100%;" onclick="demoBookNow(${item.id},'${escapeHtml(item.label)}')">
            Confirm Reservation
        </button>
    </div>`;

    document.getElementById('res-details').innerHTML = html;
    toggleModal('reservation-modal');
}

function demoBookNow(itemId, label) {
    const name = document.getElementById('cust-name')?.value.trim();
    if (!name) { showPopup('Customer name is required.', 'error'); return; }
    const phone = document.getElementById('cust-phone')?.value.trim() || 'N/A';
    const start = document.getElementById('cust-start')?.value || '10:00';
    const end   = document.getElementById('cust-end')?.value   || '19:00';
    const notes = document.getElementById('cust-notes')?.value.trim() || '';

    const spot = _localGrid.find(i => i.id === itemId);
    if (!spot) return;

    const newId = Date.now();
    const newRes = {
        resId: newId, id: newId,
        customerName: name, customerPhone: phone,
        startTime: start, endTime: end,
        notes, status: 'reserved', checkedIn: false
    };

    if (!Array.isArray(spot.bookingDetails)) spot.bookingDetails = [];
    spot.bookingDetails.push(newRes);
    spot.status = 'reserved';

    toggleModal('reservation-modal');
    renderGrid();
    showPopup(`Reservation created for ${name}`, 'success');

    // Also update DEMO.summary
    DEMO.summary.booked = _localGrid.filter(s => s.status !== 'free').length;
    DEMO.summary.free   = _localGrid.filter(s => s.status === 'free').length;
}

function demoCheckIn(itemId, resId, label) {
    const spot = _localGrid.find(i => i.id === itemId);
    if (!spot) return;
    const res = (spot.bookingDetails||[]).find(r => (r.resId||r.id) === resId);
    if (res) { res.checkedIn = true; res.status = 'arrived'; }
    spot.status = 'arrived';
    toggleModal('reservation-modal');
    renderGrid();
    showPopup(`${label} checked in ✓`, 'success');
}

function demoCancel(itemId, resId) {
    if (!confirm('Cancel this reservation?')) return;
    const spot = _localGrid.find(i => i.id === itemId);
    if (!spot) return;
    spot.bookingDetails = (spot.bookingDetails||[]).filter(r => (r.resId||r.id) !== resId);
    if (spot.bookingDetails.length === 0) spot.status = 'free';
    toggleModal('reservation-modal');
    renderGrid();
    showPopup('Reservation cancelled.', 'success');
}

function toggleDeleteMode() {
    isDeleteMode = !isDeleteMode;
    const btn = document.getElementById('delete-mode-btn');
    if (btn) {
        btn.textContent  = isDeleteMode ? 'Disable Delete Mode' : 'Enable Delete Mode';
        btn.style.background = isDeleteMode ? '#95a5a6' : '#e74c3c';
    }
    if (isDeleteMode) toggleModal('manage-modal');
    renderGrid();
}

function deleteSpot(id) {
    if (!confirm('Remove this spot from the layout?')) return;
    _localGrid = _localGrid.filter(i => i.id !== id);
    renderGrid();
    showPopup('Spot removed.', 'success');
}

function addSpot(e) {
    e.preventDefault();
    const form  = e.target;
    const label = form.label.value.trim().toUpperCase();
    const row   = parseInt(form.row.value, 10);
    if (!label || !row) return;
    const newSpot = {
        id: Date.now(), label, rowNumber: row,
        status: 'free', price: 25, color: '#7b2cff',
        bookingDetails: [], isMaintenance: false
    };
    _localGrid.push(newSpot);
    _localGrid.sort((a,b) => a.rowNumber - b.rowNumber || a.label.localeCompare(b.label));
    form.reset();
    toggleModal('manage-modal');
    renderGrid();
    showPopup(`Spot ${label} added to layout.`, 'success');
}

// Filter / search
function filterGrid() {
    const q = (document.getElementById('search-bar')?.value || '').toLowerCase().trim();
    document.querySelectorAll('.sunbed').forEach(el => {
        if (!q) {
            el.classList.remove('filtered-out');
        } else {
            const label    = (el.dataset.label || '');
            const bookings = (el.dataset.bookings || '');
            const match    = label.includes(q) || bookings.includes(q);
            el.classList.toggle('filtered-out', !match);
        }
    });
}

function quickRow(rowNum) {
    const q = 'row' + rowNum;
    const bar = document.getElementById('search-bar');
    // We filter by data-row instead
    document.querySelectorAll('.sunbed').forEach(el => {
        const match = String(el.dataset.row) === String(rowNum);
        el.classList.toggle('filtered-out', !match);
    });
    if (bar) bar.value = '';
}

function clearFilter() {
    const bar = document.getElementById('search-bar');
    if (bar) bar.value = '';
    document.querySelectorAll('.sunbed').forEach(el => el.classList.remove('filtered-out'));
}

// Modal outside click
document.addEventListener('click', function(e) {
    document.querySelectorAll('.modal.show').forEach(m => {
        if (e.target === m) m.classList.remove('show');
    });
});

document.addEventListener('DOMContentLoaded', () => {
    const dateInput = document.getElementById('view-date');
    if (dateInput && !dateInput.value) dateInput.value = DEMO.today;
    loadGrid();
});
</script>
</body>
</html>
